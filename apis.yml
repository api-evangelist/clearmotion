aid: clearmotion
name: ClearMotion
description: 'ClearMotion is an automotive motion-technology company founded out of
  MIT in 2012 by Zack Anderson and Shakeel Avadhany, headquartered at its US innovation
  lab in Billerica, Massachusetts, with a UK engineering hub at MIRA Technology Park
  in Nuneaton, a Shanghai office, and a production plant in Changshu, China. Its CM1
  fully active suspension system pairs the ActiValve digital hydraulic actuator with
  software that counteracts road disturbances in milliseconds, and its RoadMotion
  service is a crowdsourced, cloud-based road-surface intelligence layer that fuses
  data from vehicle sensors into a high-definition surface map accurate to better
  than 20mm, feeding proactive suspension, chassis and ADAS decisions. The company
  absorbed the Bose Ride and Project Sound active-suspension programs, is led by CEO
  Christian Steinmann, and ships with NIO (ET9, ES9) alongside collaborations with
  Porsche, BWI Group and Sona Comstar. Marketing material describes RoadMotion as an
  "end-to-end cloud API solution", but ClearMotion publishes no public developer portal,
  API documentation, machine-readable specification, SDKs or /.well-known discovery
  surface — the API is an OEM/B2B integration rather than a self-serve public API.'
